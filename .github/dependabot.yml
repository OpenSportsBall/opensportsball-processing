# Weekly dependency updates, grouped, so security fixes arrive as
# reviewable PRs without a flood of them.
version: 2
updates:
  - package-ecosystem: uv
    directory: /processing
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
