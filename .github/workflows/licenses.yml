name: licenses

on:
  pull_request:
  push:
    branches: [main]

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: REUSE compliance
        run: pipx run reuse lint
