name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  processing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # The pitch regression tests need footage fixtures, which never go in
      # git, so here they skip; pytest exits 5 when it collects no tests.
      - run: uv run pytest || [ $? -eq 5 ]
